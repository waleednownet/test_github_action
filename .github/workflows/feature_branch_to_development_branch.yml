name: "Swift — Analysis (PR -> development)"

on:
  pull_request:
    branches: ["development"]
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  analysis:
    name: Run static analysis (SwiftLint, Tailor, Slather, Lizard, Periphery)
    runs-on: macos-latest
    env:
      PROJECT: "test_github_action.xcodeproj"
      LIZARD_CCN_THRESHOLD: "15"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install analysis tools (Homebrew / gem / pip)
        run: |
          set -e
          brew update || true
          brew install swiftlint || true
          brew install tailor || curl -fsSL https://tailor.sh/install.sh | sh || true
          brew install periphery || true
          gem install slather || true
          python3 -m pip install --upgrade pip || true
          python3 -m pip install lizard || true

      - name: SwiftLint — lint (JSON report)
        run: |
          set -e
          swiftlint lint --reporter json > swiftlint-report.json
          echo "SwiftLint report saved as swiftlint-report.json"
          if [ $(jq 'length' swiftlint-report.json) -gt 0 ]; then
            echo "SwiftLint found issues!"
            exit 1
          fi

      - name: Upload SwiftLint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swiftlint-report
          path: swiftlint-report.json

      - name: Tailor — lint (JSON)
        run: |
          set -e
          tailor -f json . > tailor-report.json
          echo "Tailor report saved as tailor-report.json"
          if [ $(jq 'length' tailor-report.json) -gt 0 ]; then
            echo "Tailor found issues!"
            exit 1
          fi

      - name: Upload Tailor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tailor-report
          path: tailor-report.json

      - name: Lizard — cyclomatic complexity (JSON)
        run: |
          set -e
          lizard -l swift -C $LIZARD_CCN_THRESHOLD -o lizard-report.json .
          echo "Lizard report saved as lizard-report.json"

      - name: Upload Lizard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lizard-report
          path: lizard-report.json

      - name: Periphery — unused code scan
        run: |
          set -e
          if [ -f .periphery.yml ]; then
            periphery scan --verbose > periphery-report.txt
          else
            periphery scan --project "$PROJECT" --verbose > periphery-report.txt
          fi
          echo "Periphery report saved as periphery-report.txt"

      - name: Upload Periphery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: periphery-report
          path: periphery-report.txt

      - name: Summary (CLI)
        run: |
          echo "--- Individual reports uploaded as artifacts ---"
          echo "✅ swiftlint-report.json"
          echo "✅ tailor-report.json"
          echo "✅ lizard-report.json"
          echo "✅ periphery-report.txt"
