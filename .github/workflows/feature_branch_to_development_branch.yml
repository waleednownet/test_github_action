name: SwiftLint Analysis on PR Merge to Development

on:
  pull_request:
    branches:
      - development
    types:
      - opened
      - synchronize
      - reopened
      - closed  # Triggered when the PR is closed, either merged or manually closed

jobs:
  swiftlint:
    name: Run SwiftLint Analysis
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Swift
        run: |
          brew update
          brew install swiftlint

      - name: Run SwiftLint
        run: |
          swiftlint lint
        continue-on-error: false  # Fail the PR if there are lint issues

      - name: Upload SwiftLint report
        uses: actions/upload-artifact@v3  # Updated to v3
        with:
          name: swiftlint-report
          path: swiftlint_report.json

  delete-feature-branch:
    name: Delete Feature Branch After Merge
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true  # Only run if PR was merged

    steps:
      - name: Delete Feature Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git branch -D ${{ github.head_ref }}  # Delete the local branch
          git push origin --delete ${{ github.head_ref }}  # Delete the remote branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
