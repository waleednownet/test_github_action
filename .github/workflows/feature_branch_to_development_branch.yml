name: SwiftLint Analysis on PR Merge to Development

on:
  pull_request:
    branches:
      - development
    types:
      - opened
      - synchronize
      - reopened
      - closed

jobs:
  swiftlint:
    name: Run SwiftLint Analysis
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Swift
        uses: actions/setup-swift@v2
        with:
          swift-version: '5.7'  # Adjust to your Swift version if needed

      - name: Install SwiftLint
        run: |
          brew install swiftlint

      - name: Run SwiftLint
        run: |
          swiftlint lint
        # Don't allow PR merge if there are issues
        continue-on-error: false  # Workflow fails if there are any lint issues

      - name: Upload SwiftLint report
        uses: actions/upload-artifact@v3
        with:
          name: swiftlint-report
          path: swiftlint_report.json
