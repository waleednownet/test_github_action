name: "Swift — Analysis (PR -> development)"

on:
  pull_request:
    branches: ["development"]
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  checkout:
    name: Checkout repository
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

  build:
    name: Build project for indexing
    runs-on: macos-26
    needs: checkout
    env:
      PROJECT: "test_github_action.xcodeproj"
      SCHEME: "test_github_action"
    steps:
      - name: Build project for indexing
        run: |
          set -e
          xcodebuild -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

  install_tools:
    name: Install analysis tools (Homebrew / gem / pip)
    runs-on: macos-26
    needs: checkout
    steps:
      - name: Install analysis tools (Homebrew / gem / pip)
        run: |
          set -e
          brew update || true
          brew install swiftlint || true
          brew install tailor || curl -fsSL https://tailor.sh/install.sh | sh || true
          brew install periphery || true
          gem install slather || true
          python3 -m pip install --upgrade pip || true
          python3 -m pip install lizard || true

  swiftlint_analysis:
    name: SwiftLint — lint (JSON report)
    runs-on: macos-26
    needs: [install_tools, build]
    env:
      PROJECT: "test_github_action.xcodeproj"
      SCHEME: "test_github_action"
    steps:
      - name: Run SwiftLint Analysis
        run: |
          set -e
          swiftlint lint --reporter json > swiftlint-report.json
          echo "SwiftLint report saved as swiftlint-report.json"
          if [ $(jq 'length' swiftlint-report.json) -gt 0 ]; then
            echo "SwiftLint found issues!"
            exit 1
          fi
        continue-on-error: true

      - name: Upload SwiftLint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swiftlint-report
          path: swiftlint-report.json

  tailor_analysis:
    name: Tailor — lint (JSON)
    runs-on: macos-26
    needs: [install_tools, build]
    env:
      PROJECT: "test_github_action.xcodeproj"
      SCHEME: "test_github_action"
    steps:
      - name: Run Tailor Analysis
        run: |
          set -e
          tailor -f json . > tailor-report.json
          echo "Tailor report saved as tailor-report.json"
          if [ $(jq 'length' tailor-report.json) -gt 0 ]; then
            echo "Tailor found issues!"
            exit 1
          fi
        continue-on-error: true

      - name: Upload Tailor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tailor-report
          path: tailor-report.json

  lizard_analysis:
    name: Lizard — cyclomatic complexity (JSON)
    runs-on: macos-26
    needs: [install_tools, build]
    env:
      LIZARD_CCN_THRESHOLD: "15"
    steps:
      - name: Run Lizard Analysis
        run: |
          set -e
          lizard -l swift -C $LIZARD_CCN_THRESHOLD -o lizard-report.json .
          echo "Lizard report saved as lizard-report.json"
        continue-on-error: true

      - name: Upload Lizard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lizard-report
          path: lizard-report.json

  periphery_analysis:
    name: Periphery — unused code scan (JSON output)
    runs-on: macos-26
    needs: [install_tools, build]
    env:
      PROJECT: "test_github_action.xcodeproj"
      SCHEME: "test_github_action"
    steps:
      - name: Run Periphery Analysis
        run: |
          periphery scan \
            --project "$PROJECT" \
            --schemes "$SCHEME" \
            --format json \
            --report-exclude build.log \
            --retain-public \
            --strict \
            --quiet  > periphery-report.json
        continue-on-error: true

      - name: Upload Periphery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: periphery-report
          path: periphery-report.json

  summary:
    name: Summary (CLI)
    runs-on: macos-26
    needs: [swiftlint_analysis, tailor_analysis, lizard_analysis, periphery_analysis]
    steps:
      - name: Display summary of reports
        run: |
          echo "--- Individual reports uploaded as artifacts ---"
          echo "✅ swiftlint-report.json"
          echo "✅ tailor-report.json"
          echo "✅ lizard-report.json"
          echo "✅ periphery-report.json"
