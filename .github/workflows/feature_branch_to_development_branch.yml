# GitHub Actions workflow: CI - Swift analysis with PR Annotations
# Trigger: when a pull request targets the `development` branch
# Place this file at: .github/workflows/ci-analysis.yml

name: "Swift — Analysis (PR -> development)"

on:
  pull_request:
    branches: ["development"]
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  analysis:
    name: Run static analysis (SwiftLint, Tailor, Slather, Lizard, Periphery)
    runs-on: macos-latest
    env:
      PROJECT: "test_github_action.xcodeproj"
      LIZARD_CCN_THRESHOLD: "15"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install analysis tools (Homebrew / gem / pip)
        run: |
          set -e
          brew update || true
          brew install swiftlint || true
          brew install tailor || curl -fsSL https://tailor.sh/install.sh | sh || true
          brew install periphery || true
          gem install slather || true
          python3 -m pip install --upgrade pip || true
          python3 -m pip install lizard || true

      - name: SwiftLint — lint (JSON report)
        id: swiftlint
        run: |
          set -e
          swiftlint lint --reporter json > swiftlint-report.json
          echo "Saved: swiftlint-report.json"

      - name: Annotate SwiftLint results on PR
        if: always()
        uses: reviewdog/action-suggester@v1
        with:
          tool_name: swiftlint
          reporter: github-pr-review
          fail_on_error: true
          filter_mode: diff_context
          reviewdog_flags: "-f=swiftlint -reporter=github-pr-review"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          level: error
          path: .
          # reviewdog supports swiftlint JSON input via stdin
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat swiftlint-report.json | reviewdog -f=swiftlint -reporter=github-pr-review -fail-on-error

      - name: Tailor — lint (JSON)
        run: |
          set -e
          tailor -f json . > tailor-report.json
          echo "Saved: tailor-report.json"

      - name: Lizard — cyclomatic complexity (JSON)
        run: |
          set -e
          lizard -l swift -C $LIZARD_CCN_THRESHOLD -o lizard-report.json .
          echo "Saved: lizard-report.json"

      - name: Periphery — unused code scan
        run: |
          set -e
          if [ -f .periphery.yml ]; then
            periphery scan --verbose > periphery-report.txt
          else
            periphery scan --project "$PROJECT" --verbose > periphery-report.txt
          fi
          echo "Saved: periphery-report.txt"

      - name: Package analysis reports as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: analysis-reports
          path: |
            swiftlint-report.json
            tailor-report.json
            lizard-report.json
            periphery-report.txt

      - name: Summary (CLI)
        run: |
          echo "--- Reports available as artifact: analysis-reports ---"
          echo "SwiftLint issues are now annotated directly in the PR via Reviewdog."
